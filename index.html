<!DOCTYPE html>
<html lang="pt-BR" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Refurbished | PS4</title>
<style>
:root { color-scheme:dark; --bg:#080d18; --panel:#101b2e; --line:#263c59; --blue:#3989ff; --cyan:#54d5ff; --text:#f3f7ff; --muted:#9bacc3; --green:#70e0b1; }
* { box-sizing:border-box; }
html,body { min-height:100%; margin:0; }
body { color:var(--text); font:15px/1.5 "Segoe UI",system-ui,sans-serif; background:radial-gradient(ellipse at 50% -15%,#194c91 0,transparent 48%),linear-gradient(150deg,#080d18,#0c1422 65%,#101a2b); }
body::before { content:""; position:fixed; inset:0; z-index:0; pointer-events:none; background:url("Refurbished67.png") center center / auto 72vh no-repeat; opacity:.075; }
#brand { position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:12px; padding:22px 16px; border-bottom:1px solid #ffffff18; background:#050a13aa; }
#brand .mark { display:grid; place-items:center; width:38px; height:38px; border:1px solid #54d5ff88; border-radius:11px; color:#fff; background:linear-gradient(145deg,#3989ff,#1650a3); box-shadow:0 0 22px #168bff55; font-size:20px; font-weight:800; }
#brand b { color:#f5f9ff; font-size:15px; letter-spacing:.2em; font-weight:750; }
#warn { position:relative; z-index:1; max-width:920px; margin:22px auto 0; padding:12px 16px; border:1px solid #f6ba5355; border-radius:10px; background:#593a102b; color:#f1d39a; text-align:center; font-size:12px; font-weight:700; letter-spacing:.04em; line-height:1.65; }
#warn b { color:#fff0c8; }
#wrap { position:relative; z-index:1; width:min(560px,calc(100% - 32px)); margin:44px auto 90px; padding:30px; border:1px solid var(--line); border-radius:18px; background:linear-gradient(145deg,#142642f2,#101b2eee); box-shadow:0 24px 70px #0008,inset 0 1px #ffffff0d; }
#eyebrow { margin:0 0 17px; color:var(--cyan); font-size:11px; font-weight:750; letter-spacing:.18em; text-transform:uppercase; }
#state { margin:0 0 8px; font-size:clamp(21px,5vw,28px); line-height:1.25; font-weight:700; }
#det { min-height:22px; color:var(--muted); font-size:13px; }
#det b { color:#e5f3ff; font-weight:650; }
#cache { min-height:20px; margin-top:11px; color:#8799b1; font-size:12px; }
#cache.cacheok,.ok { color:var(--green); } .bad { color:#ff9299; } .warn { color:#ffe099; }
#foot { position:fixed; z-index:2; left:0; right:0; bottom:0; padding:14px 12px; border-top:1px solid #ffffff18; background:#050a13e8; text-align:center; color:#8294ad; font-size:11px; letter-spacing:.1em; }
#foot b { color:#dceaff; font-weight:700; }
@media(max-width:600px) { #brand { padding:17px 12px; } #warn { margin:15px 12px 0; padding:11px 12px; font-size:11px; } #wrap { margin-top:28px; padding:24px 20px; } }
</style>
</head>
<body>
<div id="brand"><span class="mark" aria-hidden="true">R</span><b>REFURBISHED</b></div>
<div id="warn">GOLDHEN DISPONÍVEL PARA OS FIRMWARES <b>11.00, 11.50, 12.00, 12.50, 13.00, 13.02, 13.04, 13.50 E 13.52</b></div>
<div id="wrap">
  <p id="eyebrow">PlayStation 4 &nbsp;·&nbsp; Central do sistema</p>
  <div id="state">Detectando firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
    // own kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
    // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;
    function go() { setState("loading jailbreak...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk on the real 13.52 console can never lock it out.
    if (!supported) {
        setState("NÃO COMPATIVEL COM ESSA FIRMWARE", "bad");
        waitForTap("NÃO SUPORTA (" + (key || "unknown") + ") -- APERTE  X PARA COMEÇAR ", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
<div id="foot"><b>REFURBISHED</b> &nbsp;·&nbsp; PS4 SYSTEM</div>
</body>
</html>
